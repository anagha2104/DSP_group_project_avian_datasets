<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Avian Explorer</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-top: 20px;}
        
        /* Navigation Bar Styles */
        .navbar { background-color: #333; overflow: hidden; border-radius: 8px; }
        .navbar a { float: left; display: block; color: white; text-align: center; padding: 14px 20px; text-decoration: none; font-weight: bold;}
        .navbar a:hover { background-color: #ddd; color: black; }
        
        /* Form & Table Styles */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #f8f9fa; }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="{% url 'dashboard-home' %}">🔍 Trait Lookup</a>
        <a href="{% url 'reverse-matcher' %}">🎯 Reverse Matcher</a>
        <a href="{% url 'pca-analysis' %}">🧬 PCA Analysis</a>
    </div>

    {% block content %}
    {% endblock %}

</body>
</html>
